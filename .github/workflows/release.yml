name: Reusable Rust Agent Release

# Reusable release pipeline para los agentes Rust de SecuryBlack (OxiPulse,
# FerroSentry, CupraFlow, Nexus Agent, y en el futuro CromoForge).
#
# Diseñado a partir del diff de los 4 release.yml existentes: son idénticos
# salvo binary name, matriz de targets, flags de cargo por target y (solo
# CupraFlow) ficheros extra empaquetados junto al binario.
#
# Uso desde el repo del agente (.github/workflows/release.yml):
#
#   name: Release
#   on:
#     push:
#       tags: ['v*']
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: securyblack/sb-agent-core/.github/workflows/release.yml@master
#       with:
#         binary-name: oxipulse
#         targets-json: |
#           [
#             {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest","archive_ext":"tar.gz","cross":false},
#             {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-latest","archive_ext":"tar.gz","cross":true},
#             {"target":"x86_64-pc-windows-msvc","os":"windows-latest","archive_ext":"zip","cross":false}
#           ]
#         windows-static-crt: true   # solo OxiPulse lo necesitaba hoy
#
# Releases firmadas: la release se crea SIEMPRE como borrador. Los agentes
# (sb-agent-core >= 0.3) solo aceptan archivos firmados con una clave ed25519
# que no vive en GitHub, así que CI no puede firmar ni debe publicar. Flujo:
#
#   1. push del tag -> este workflow compila y deja la release en borrador
#      (invisible para los agentes y para los instaladores, que usan /latest).
#   2. quien custodia la clave ejecuta, en su máquina:
#        scripts/sign-release.sh securyblack/<repo> <tag> [--publish]
#      que firma cada .tar.gz/.zip, regenera los .sha256 y los resube.
#   3. publicar el borrador (lo hace --publish, o a mano con
#      `gh release edit <tag> -R <repo> --draft=false`).
#
# Ningún job del repo del agente debe publicar la release por su cuenta
# (`gh release edit --draft=false`): saldría un binario sin firmar que los
# agentes rechazarían, y con releases inmutables ya no se puede arreglar.

on:
  workflow_call:
    inputs:
      binary-name:
        description: Nombre del binario compilado (ej. "oxipulse", "nexus-agent")
        required: true
        type: string
      targets-json:
        description: >
          Matriz de targets como JSON array de objetos
          {target, os, archive_ext, cross, cargo-features}.
          cross y cargo-features son opcionales (default: false / "").
        required: true
        type: string
      windows-static-crt:
        description: Añade RUSTFLAGS=-C target-feature=+crt-static al compilar x86_64-pc-windows-msvc
        required: false
        type: boolean
        default: false
      glibc:
        description: >
          Versión mínima de glibc para los targets *-linux-gnu (ej. "2.17").
          Compila con cargo-zigbuild para que el binario arranque en distros
          antiguas; vacío = cargo build en ubuntu-latest (exige su glibc, 2.39).
        required: false
        type: string
        default: ""
      draft:
        description: >
          OBSOLETO, se ignora: la release sale siempre como borrador para
          firmarla antes de publicar. Se mantiene para no romper a los agentes
          que aún lo pasan (workflow_call falla con inputs desconocidos).
        required: false
        type: boolean
        default: true
      extra-files:
        description: >
          Rutas (separadas por espacio, relativas al repo) a empaquetar junto
          al binario en el archivo de release. Vacío = solo el binario (caso común).
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets-json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: inputs.glibc != '' && contains(matrix.target, 'linux-gnu')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: inputs.glibc != '' && contains(matrix.target, 'linux-gnu')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install aarch64 cross-compilation toolchain
        if: matrix.cross == true && !(inputs.glibc != '' && contains(matrix.target, 'linux-gnu'))
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUSTFLAGS: ${{ (inputs.windows-static-crt && matrix.target == 'x86_64-pc-windows-msvc') && '-C target-feature=+crt-static' || '' }}
        shell: bash
        run: |
          if [ -n "${{ inputs.glibc }}" ] && [[ "${{ matrix.target }}" == *linux-gnu ]]; then
            unset CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            cargo zigbuild --release --target "${{ matrix.target }}.${{ inputs.glibc }}" ${{ matrix.cargo-features || '' }}
          else
            cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo-features || '' }}
          fi

      # ── Linux packaging ──────────────────────────────────────────────────
      - name: Package (Linux tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          set -euo pipefail
          ASSET="${{ inputs.binary-name }}-${{ matrix.target }}"
          STAGE="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${{ inputs.binary-name }}" "$STAGE/"
          for f in ${{ inputs.extra-files }}; do cp "$f" "$STAGE/"; done
          # `tar -C "$STAGE" .` empaqueta las entradas como "./ferro-sentry"
          # (con el prefijo "./"), pero `self_update` busca la ruta exacta
          # del binario sin ese prefijo dentro del archivo — el auto-update
          # fallaba en todos los agentes con "Could not find the required
          # path in the archive". Listar los ficheros explícitamente evita
          # el prefijo.
          tar czf "${ASSET}.tar.gz" -C "$STAGE" $(cd "$STAGE" && ls)
          sha256sum "${ASSET}.tar.gz" > "${ASSET}.tar.gz.sha256"
          echo "ASSET_PATH=${ASSET}.tar.gz" >> "$GITHUB_ENV"
          echo "CHECKSUM_PATH=${ASSET}.tar.gz.sha256" >> "$GITHUB_ENV"

      # ── Windows packaging ────────────────────────────────────────────────
      - name: Package (Windows zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $asset = "${{ inputs.binary-name }}-${{ matrix.target }}"
          $stage = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP $asset)
          Copy-Item "target\${{ matrix.target }}\release\${{ inputs.binary-name }}.exe" $stage
          foreach ($f in "${{ inputs.extra-files }}".Split(" ", [StringSplitOptions]::RemoveEmptyEntries)) {
            Copy-Item $f $stage
          }
          Compress-Archive -Path "$stage\*" -DestinationPath "${asset}.zip"
          $hash = (Get-FileHash "${asset}.zip" -Algorithm SHA256).Hash.ToLower()
          "${hash}  ${asset}.zip" | Set-Content "${asset}.zip.sha256"
          "ASSET_PATH=${asset}.zip"          | Add-Content $env:GITHUB_ENV
          "CHECKSUM_PATH=${asset}.zip.sha256" | Add-Content $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error

  release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
          # Siempre borrador: se publica tras firmar (ver cabecera).
          draft: true
          fail_on_unmatched_files: true
