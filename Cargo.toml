[package]
name = "sb-agent-core"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared runtime (config, logging, service wrapper, updater, status socket) for SecuryBlack's Rust agents"
repository = "https://github.com/securyblack/sb-agent-core"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "signatures"] }
ratatui = "0.30"
crossterm = "0.28"
rand = "0.8"
# Ya en el árbol vía self_update/zipsign; directas para command_signing y el anti-rollback.
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tempfile = "3"
zipsign-api = { version = "0.1", default-features = false, features = ["sign-tar", "verify-tar"] }
